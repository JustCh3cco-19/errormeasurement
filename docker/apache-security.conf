ServerTokens Prod
ServerSignature Off
<Directory /var/www/html/public>
    AllowOverride All
    Options -Indexes
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://www.paypal.com https://www.paypalobjects.com; connect-src 'self' https://www.paypal.com https://*.paypal.com; frame-src https://www.paypal.com https://*.paypal.com; img-src 'self' data: https://*.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'"
